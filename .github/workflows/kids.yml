name: BoomBoo Video

on:
  schedule:
    - cron: "47 13 * * *"   # her gun 1 Short: 16:47 Turkiye = ABD sabahi
  workflow_dispatch:
    inputs:
      dry_run:
        description: "1 = do not upload, save preview"
        required: false
        default: "0"
      topic:
        description: "colors / numbers / abc / shapes / rhyme / habits (empty = rotate)"
        required: false
        default: ""

permissions:
  contents: write

concurrency:
  group: boomboo
  cancel-in-progress: false

jobs:
  video:
    runs-on: ubuntu-latest
    timeout-minutes: 75
    steps:
      - uses: actions/checkout@v4
      - name: Setup
        run: |
          [ -f kids.py.gz ] && gunzip -kf kids.py.gz
          for g in patches/*.patch.gz; do [ -f "$g" ] && gunzip -kf "$g"; done
          for p in patches/*.patch; do [ -f "$p" ] && patch -p1 < "$p"; done
          command -v ffmpeg || (sudo apt-get update -qq && sudo apt-get install -y -qq ffmpeg)
          pip install -q numpy pillow edge-tts fonttools
          mkdir -p assets
          get() { curl -fsSL --retry 5 --retry-delay 6 -o "$1" "https://github.com/google/fonts/raw/main/$2" || curl -fsSL --retry 5 --retry-delay 6 -o "$1" "https://cdn.jsdelivr.net/gh/google/fonts@main/$2"; }
          get assets/EricaOne-Regular.ttf "ofl/ericaone/EricaOne-Regular.ttf"
          get /tmp/Outfit.ttf "ofl/outfit/Outfit%5Bwght%5D.ttf"
          fonttools varLib.instancer /tmp/Outfit.ttf wght=700 -q -o assets/Outfit-Bold.ttf
      - name: Make and upload video
        env:
          KIDS_GEMINI_KEY: ${{ secrets.KIDS_GEMINI_KEY }}
          KIDS_CLIENT_ID: ${{ secrets.KIDS_CLIENT_ID }}
          KIDS_CLIENT_SECRET: ${{ secrets.KIDS_CLIENT_SECRET }}
          KIDS_REFRESH_TOKEN: ${{ secrets.KIDS_REFRESH_TOKEN }}
          KIDS_DRY_RUN: ${{ inputs.dry_run || '0' }}
          KIDS_TOPIC: ${{ inputs.topic || '' }}
          KIDS_MODE: short   # sadece Short (eski sarki derlemeleri kaldirildi)
        run: python kids.py
      - name: Save history / preview
        if: always()
        run: |
          git config user.name "boomboo-bot"
          git config user.email "boomboo-bot@users.noreply.github.com"
          if [ "${{ inputs.dry_run }}" = "1" ] && [ -f out/summary.json ]; then
            mkdir -p preview && rm -f preview/*
            for f in out/short.mp4 out/thumb.jpg out/summary.json; do [ -f "$f" ] && cp "$f" preview/; done
            git add -A preview
          fi
          git add history.json || true
          git commit -m "BoomBoo update" && (git pull --rebase -q || true) && git push || true
