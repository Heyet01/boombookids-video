name: Seal

on:
  workflow_dispatch: {}

permissions:
  contents: write

jobs:
  s:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Seal
        env:
          K: ${{ secrets.KIDS_GEMINI_KEY }}
        run: |
          pip install -q pynacl
          python - <<'PY'
          import os, json, base64
          from nacl import public, encoding
          pk = public.PublicKey(b"vR04g2HoYyWdsC5T1ERbdeXAgxVo24K2qmHtzhu/ozg=", encoding.Base64Encoder())
          k = os.environ["K"].strip()
          ct = public.SealedBox(pk).encrypt(k.encode())
          json.dump({"key_id": "3380204578043523366", "encrypted_value": base64.b64encode(ct).decode(), "n": len(k)}, open("/tmp/sealed.json", "w"))
          PY
          git config user.name boomboo-bot
          git config user.email boomboo-bot@users.noreply.github.com
          git checkout -q --orphan tmp-seal
          git rm -rfq .
          cp /tmp/sealed.json sealed.json
          git add sealed.json
          git commit -qm seal
          git push -qf origin tmp-seal
